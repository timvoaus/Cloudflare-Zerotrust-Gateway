name: Weekly Cloudflare Gateway Refresh

on:
  schedule:
    # GitHub Actions schedules use UTC. These two Saturday UTC times cover
    # 2 AM Sunday in Sydney during AEDT and AEST; the guard step below keeps
    # only the matching Sydney-time run.
    - cron: "0 15,16 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-cloudflare-gateway-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Cloudflare Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HTTPSMS_APPRISE_URL: ${{ secrets.HTTPSMS_APPRISE_URL }}
      ALLOWLIST_URLS: ${{ vars.ALLOWLIST_URLS }}
      BLOCKLIST_URLS: ${{ vars.BLOCKLIST_URLS }}
      BLOCK_BASED_ON_SNI: ${{ vars.BLOCK_BASED_ON_SNI || '0' }}
      CLOUDFLARE_LIST_ITEM_LIMIT: ${{ vars.CLOUDFLARE_LIST_ITEM_LIMIT || '300000' }}
      CZGS_API_CONCURRENCY: ${{ vars.CZGS_API_CONCURRENCY || '3' }}
      CZGS_DOWNLOAD_CONCURRENCY: ${{ vars.CZGS_DOWNLOAD_CONCURRENCY || '3' }}
      CZGS_FORCE_SYNC: ${{ vars.CZGS_FORCE_SYNC || '0' }}
      CZGS_SKIP_SYNC_IF_UNCHANGED: ${{ vars.CZGS_SKIP_SYNC_IF_UNCHANGED || '1' }}
      GATEWAY_PATCH_CHUNK_SIZE: ${{ vars.GATEWAY_PATCH_CHUNK_SIZE || '500' }}
      DOTENV_CONFIG_QUIET: "true"

    steps:
      - name: Check Sydney schedule window
        id: schedule_guard
        shell: bash
        run: |
          set -euo pipefail

          sydney_time="$(TZ=Australia/Sydney date '+%Y-%m-%d %H:%M:%S %Z')"
          sydney_day_hour="$(TZ=Australia/Sydney date '+%u %H')"

          echo "Sydney time: ${sydney_time}"
          echo "sydney_time=${sydney_time}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_EVENT_NAME}" == "schedule" && "${sydney_day_hour}" != "7 02" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: this scheduled run is not Sunday 02:00 in Australia/Sydney."
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.schedule_guard.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.schedule_guard.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm

      - name: Install dependencies
        if: steps.schedule_guard.outputs.should_run == 'true'
        run: npm ci

      - name: Validate required secrets
        if: steps.schedule_guard.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [[ -n "${CLOUDFLARE_ACCOUNT_ID}" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [[ -n "${CLOUDFLARE_API_TOKEN}" ]] || missing+=("CLOUDFLARE_API_TOKEN")
          [[ -n "${TELEGRAM_BOT_TOKEN}" ]] || missing+=("TELEGRAM_BOT_TOKEN")
          [[ -n "${TELEGRAM_CHAT_ID}" ]] || missing+=("TELEGRAM_CHAT_ID")

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Default optional configuration
        if: steps.schedule_guard.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "BLOCK_BASED_ON_SNI=${BLOCK_BASED_ON_SNI:-0}"
            echo "CLOUDFLARE_LIST_ITEM_LIMIT=${CLOUDFLARE_LIST_ITEM_LIMIT:-300000}"
            echo "CZGS_API_CONCURRENCY=${CZGS_API_CONCURRENCY:-3}"
            echo "CZGS_DOWNLOAD_CONCURRENCY=${CZGS_DOWNLOAD_CONCURRENCY:-3}"
            echo "CZGS_FORCE_SYNC=${CZGS_FORCE_SYNC:-0}"
            echo "CZGS_SKIP_SYNC_IF_UNCHANGED=${CZGS_SKIP_SYNC_IF_UNCHANGED:-1}"
            echo "GATEWAY_PATCH_CHUNK_SIZE=${GATEWAY_PATCH_CHUNK_SIZE:-500}"
          } >> "$GITHUB_ENV"

      - name: Run Cloudflare refresh
        if: steps.schedule_guard.outputs.should_run == 'true'
        id: refresh
        shell: bash
        run: |
          set -o pipefail

          started_at="$(TZ=Australia/Sydney date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "started_at=${started_at}" >> "$GITHUB_OUTPUT"

          npm run cloudflare-refresh 2>&1 \
            | sed -E 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/[redacted-id]/g' \
            | tee czgs-refresh.log
          status=${PIPESTATUS[0]}

          finished_at="$(TZ=Australia/Sydney date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "finished_at=${finished_at}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"

          exit "$status"

      - name: Send Telegram report
        if: steps.schedule_guard.outputs.should_run == 'true' && always()
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.refresh.outcome }}" == "success" ]]; then
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            message="$(printf '✅ CZGS refresh succeeded\n%s' "${run_url}")"
          else
            if [[ -f czgs-refresh.log ]]; then
              log_tail="$(tail -n 20 czgs-refresh.log | tail -c 2000)"
            else
              log_tail="Refresh log was not created. Check the GitHub Actions run for setup or validation errors."
            fi

            message="$(printf '❌ CZGS refresh failed\n%s' "${log_tail}")"
          fi

          curl --fail --show-error --silent \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}"

      - name: Send httpSMS report with Apprise
        if: steps.schedule_guard.outputs.should_run == 'true' && always()
        shell: bash
        run: |
          set -u

          if [[ -z "${HTTPSMS_APPRISE_URL}" ]]; then
            echo "HTTPSMS_APPRISE_URL is not set. Skipping SMS notification."
            exit 0
          fi

          if [[ "${{ steps.refresh.outcome }}" == "success" ]]; then
            sms_message="✅ CZGS refresh succeeded"
          else
            if [[ -f czgs-refresh.log ]]; then
              log_tail="$(tail -n 12 czgs-refresh.log | tail -c 1000)"
            else
              log_tail="Refresh log was not created. Check the GitHub Actions run for setup or validation errors."
            fi

            sms_message="$(printf '❌ CZGS refresh failed\n%s' "${log_tail}")"
          fi

          python3 -m venv "${RUNNER_TEMP}/apprise-venv"
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/apprise-venv/bin/activate"

          if ! python -m pip install --quiet apprise; then
            echo "::warning::Could not install Apprise. Skipping SMS notification."
            exit 0
          fi

          if ! apprise -t "CZGS refresh" -b "${sms_message}" "${HTTPSMS_APPRISE_URL}"; then
            echo "::warning::Could not send httpSMS notification with Apprise."
          fi
